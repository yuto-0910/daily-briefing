
    <!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Daily Briefing Dashboard</title>
        <style>
            body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background: #eee; }
            .tabs { background: #333; overflow-x: auto; white-space: nowrap; padding: 10px; display: flex; gap: 8px; }
            .tab-btn { background: #555; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 6px; transition: 0.3s; }
            .tab-btn.active { background: #007bff; font-weight: bold; }
            .tab-content { display: none; flex-grow: 1; }
            .tab-content.active { display: block; }
            iframe { border: none; width: 100%; height: 100%; background: white; }
        </style>
        <script>
            function showTab(id, btn) {
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                btn.classList.add('active');
            }
        </script>
    </head>
    <body>
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('tab-2026-05-27', this)">2026-05-27</button><button class="tab-btn " onclick="showTab('tab-2026-05-26', this)">2026-05-26</button><button class="tab-btn " onclick="showTab('tab-2026-05-25', this)">2026-05-25</button><button class="tab-btn " onclick="showTab('tab-2026-05-24', this)">2026-05-24</button><button class="tab-btn " onclick="showTab('tab-2026-05-23', this)">2026-05-23</button><button class="tab-btn " onclick="showTab('tab-2026-05-22', this)">2026-05-22</button><button class="tab-btn " onclick="showTab('tab-2026-05-21', this)">2026-05-21</button>
        </div>
        <div id="tab-2026-05-27" class="tab-content active"><iframe src="briefings/2026-05-27.html" width="100%" height="800px"></iframe></div><div id="tab-2026-05-26" class="tab-content "><iframe src="briefings/2026-05-26.html" width="100%" height="800px"></iframe></div><div id="tab-2026-05-25" class="tab-content "><iframe src="briefings/2026-05-25.html" width="100%" height="800px"></iframe></div><div id="tab-2026-05-24" class="tab-content "><iframe src="briefings/2026-05-24.html" width="100%" height="800px"></iframe></div><div id="tab-2026-05-23" class="tab-content "><iframe src="briefings/2026-05-23.html" width="100%" height="800px"></iframe></div><div id="tab-2026-05-22" class="tab-content "><iframe src="briefings/2026-05-22.html" width="100%" height="800px"></iframe></div><div id="tab-2026-05-21" class="tab-content "><iframe src="briefings/2026-05-21.html" width="100%" height="800px"></iframe></div>
    </body>
